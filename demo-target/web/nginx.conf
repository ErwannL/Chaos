server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve "api" often: its address changes when a network is detached
  # (egress_block), and nginx would otherwise keep the stale IP.
  resolver 127.0.0.11 valid=1s ipv6=off;
  set $api http://api:3000;
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;

  location ~ ^/(health|livez|metrics)$ {
    proxy_pass $api;
  }
  location /api/ {
    proxy_pass $api;
  }
  location / {
    try_files $uri /index.html;
  }
}
