<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Chaos">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <style>
    /* 4 s loop: the ring turns, a fault strikes, segments shake apart then recover */
    .ring { transform-origin: 64px 64px; animation: spin 8s linear infinite; }
    .seg { transform-origin: 64px 64px; animation: break 4s ease-in-out infinite; }
    .s2 { animation-delay: .08s } .s3 { animation-delay: .16s } .s4 { animation-delay: .24s }
    .bolt { transform-origin: 64px 64px; animation: strike 4s ease-in-out infinite; }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes break {
      0%, 30%, 70%, 100% { transform: translate(0, 0); opacity: 1 }
      38% { transform: translate(4px, -3px); opacity: .5 }
      44% { transform: translate(-3px, 4px); opacity: .8 }
      50% { transform: translate(3px, 3px); opacity: .4 }
      58% { transform: translate(-2px, -2px); opacity: .9 }
    }
    @keyframes strike {
      0%, 28% { transform: scale(.6); opacity: 0 }
      32% { transform: scale(1.15); opacity: 1 }
      36%, 40% { opacity: .3 } 38%, 44% { opacity: 1 }
      60% { transform: scale(1); opacity: 1 }
      80%, 100% { transform: scale(.6); opacity: 0 }
    }
    @keyframes glow { 0%, 28%, 70%, 100% { opacity: 0 } 34% { opacity: .55 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .seg, .bolt, .glow { animation: none } .bolt { opacity: 1 }
    }
  </style>
  <rect width="128" height="128" rx="28" fill="#0a0a0a"/>
  <circle class="glow" cx="64" cy="64" r="34" fill="#fbbf24" opacity="0"/>
  <g class="ring" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round">
    <path class="seg" d="M64 22a42 42 0 0 1 36.4 21"/>
    <path class="seg s2" d="M104.8 58a42 42 0 0 1-17.3 40.8"/>
    <path class="seg s3" d="M72 105.3a42 42 0 0 1-44.4-20"/>
    <path class="seg s4" d="M23.3 70a42 42 0 0 1 24.6-44.8"/>
  </g>
  <path class="bolt" d="M70 30 46 68h16l-6 30 26-40H66z" fill="#fbbf24" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/>
</svg>
