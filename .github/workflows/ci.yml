name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check:size

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # >= 95 % lines/branches/functions/statements PER FILE, every workspace
      - run: npm run coverage
      # The tests must be able to fail: break each guard, expect red.
      - run: npm run test:mutation
      - run: npm run build

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Chromium for browser faults
        run: npx -y playwright@1.56.1 install --with-deps chromium
      - name: Real scenarios against the demo stack
        run: npm run test:integration
      - name: Dump demo logs on failure
        if: failure()
        run: docker compose -f demo-target/docker-compose.yml logs --tail 200

  docker:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chaos .
